ekf_filter_node:
  ros__parameters:

    frequency: 30.0

    two_d_mode: true

    publish_tf: true

    map_frame: map              # Defaults to "map" if unspecified
    odom_frame: odom_lidar            # Defaults to "odom" if unspecified
    base_link_frame: base_link  # Defaults to "base_link" if unspecified
    world_frame: odom_lidar           # Defaults to the value of odom_frame if unspecified


    # values is x, y, z,  
    #           roll, pitch, yaw, 
    #           vx, vy, vz, 
    #           vroll, vpitch, vyaw, 
    #           ax, ay, az

    odom0: /kiss/odometry
    odom0_config: [true, true, false,
                  false, false, false,
                  true, true, false,
                  false, false, false,
                  false, false, false]
    odom0_differential: false

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: false